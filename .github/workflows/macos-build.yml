name: macOS Build

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Add Apple Silicon target
        run: rustup target add aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend check
        run: npm run check

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build macOS app (debug)
        run: npm run tauri build -- --debug --target aarch64-apple-darwin

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v5
        with:
          name: stringcraft-macos-debug
          path: |
            src-tauri/target/**/bundle/**/*.app
            src-tauri/target/**/bundle/**/*.dmg
